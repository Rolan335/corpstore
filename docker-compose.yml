services:
  corpstore:
    build: .
    user: root
    image: corpstore:local
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - corpstore-data:/data
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: corpuser
      POSTGRES_PASSWORD: corppass
      POSTGRES_DB: corpstore
    volumes:
      - corpstore-db:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  corpstore-data:
    driver: local
  corpstore-db:
    driver: local
